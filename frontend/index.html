<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Chain</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        #search {
            padding: 8px;
            margin-right: 10px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .buttons {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<h1>Transaction Chain</h1>
<div class="buttons">
    <input type="text" id="search" placeholder="Enter primary ID...">
    <button onclick="fetchTransactionChain()">Search Chain</button>
    <button onclick="fetchTransactionsWithErrors()">Show Errors Only</button>
</div>
<div id="result"></div>

<script>
    async function fetchTransactionChain() {
        const primaryId = document.getElementById('search').value;
        const url = `http://localhost:8080/api/v1/transactions/chain/primaryId/${primaryId}`;
        await fetchAndDisplay(url);
    }

    async function fetchTransactionsWithErrors() {
        const url = `http://localhost:8080/api/v1/transactions/errors`;
        await fetchAndDisplay(url);
    }

    async function fetchAndDisplay(url) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<p>Loading...</p>';

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch');
            const data = await response.json();
            displayTransactions(data);
        } catch (error) {
            resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
        }
    }

    function displayTransactions(transactions) {
        const resultDiv = document.getElementById('result');
        if (!transactions.length) {
            resultDiv.innerHTML = "<p>No transactions found.</p>";
            return;
        }

        let table = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Event Rank</th>
                            <th>Event Type</th>
                            <th>Primary ID</th>
                            <th>Secondary ID</th>
                            <th>Step Rank</th>
                            <th>Errors</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

        transactions.forEach(tx => {
            table += `
                    <tr>
                        <td>${tx.date}</td>
                        <td>${tx.eventRank}</td>
                        <td>${tx.eventType}</td>
                        <td>${tx.primaryId}</td>
                        <td>${tx.secondaryId}</td>
                        <td>${tx.stepRank}</td>
                        <td>${tx.transactionErrors.length ? tx.transactionErrors.join(', ') : '-'}</td>
                    </tr>
                `;
        });

        table += `</tbody></table>`;
        resultDiv.innerHTML = table;
    }
</script>
</body>
</html>
